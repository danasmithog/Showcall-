<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Showcall — App</title>

<style>
/* VOICE: crew-facing is warm and a little nautical-witty (from the I&O prompt); safety and money screens stay plain.
   IDEA: a banquet run-of-show card that drives every phone and wrist in the room.
   PICTURE: the live clock + the wrist — a watch face that turns red when service must stop.
   COLOUR and TYPE: the gala's own black & gold, signal red for pauses, green for go. Fredoka headings, Rubik body.
   LAYOUT: two shells over one state — Floor (worker phone, bottom tabs) and Planner (board for the event manager). */
:root{color-scheme:dark;--bg:#0d0e11;--panel:#16181d;--soft:#1e2128;--line:#2c313a;--ink:#f1efe8;--dim:#a3a8b2;
 --gold:#d9b45f;--on:#1a1408;--stop:#ff5d4d;--stopbg:#3b1512;--warn:#f3b843;--warnbg:#33270e;--go:#5fd394;--gobg:#10301f;--info:#86b6ff;
 --fd:"Fredoka",system-ui,sans-serif;--fb:"Rubik",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);overflow-x:clip}
body.tabs-on{padding-bottom:84px}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0}
h1{font-size:clamp(24px,4vw,32px);line-height:1.05}h1 span{color:var(--gold)}
h2{font-size:18px}h3{font-size:16px;font-family:var(--fb);font-weight:500}
.top{position:sticky;top:0;z-index:6;background:#0b0c0fee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:10px max(16px,3vw);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.clock{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{font:600 26px var(--fd);font-variant-numeric:tabular-nums;color:var(--gold);min-width:4.6em}
.wrap{max-width:1180px;margin:0 auto;padding:14px max(16px,3vw) 40px;display:flex;flex-direction:column;gap:12px}
.lay-floor .wrap{max-width:640px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.st{display:inline-block;padding:1px 8px;border-radius:5px;font:500 11px var(--fb);letter-spacing:.03em;text-transform:uppercase;background:var(--soft);color:var(--dim);white-space:nowrap}
.st.proto{color:var(--info);background:#16233a}.st.plan{color:var(--warn);background:var(--warnbg)}.st.work{color:var(--go);background:var(--gobg)}.st.stop{color:var(--stop);background:var(--stopbg)}
.note{margin:0;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--dim);font-size:13.5px}
button,.btn{font:500 15px var(--fb);min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.pri{background:var(--gold);color:var(--on);border-color:var(--gold)}
button.sm{min-height:34px;padding:0 10px;font-size:13.5px}
button[aria-pressed=true]{background:var(--gold);color:var(--on);border-color:var(--gold)}
button[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:38px}
input,select,textarea{font:400 16px var(--fb);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:60px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row small,.muted{color:var(--dim);font-size:13.5px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{min-height:34px;border-radius:99px;font-size:13.5px}
/* now / next */
.now{border-radius:14px;padding:16px;display:grid;gap:6px;border:1px solid var(--line);background:var(--panel)}
.now.stop{background:var(--stopbg);border-color:#7a2c23}.now.go{background:var(--gobg);border-color:#22603f}
.now .big{font:600 clamp(26px,6vw,38px)/1.05 var(--fd)}
.now.stop .big{color:var(--stop)}.now.go .big{color:var(--go)}
.cd{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:5.4em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .t{font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl li.past{opacity:.5}.tl li.cur{background:#211d12;margin:0 -8px;padding:8px;border-radius:8px}
.tl li.pause .t{color:var(--stop)}
/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto}
.msg{padding:9px 12px;border-radius:12px;background:var(--soft);display:grid;gap:3px}
.msg.me{background:#2a2414}.msg.cue{background:var(--warnbg);border:1px solid #5b4516}.msg.cue.stop{background:var(--stopbg);border-color:#7a2c23}
.msg header{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--dim)}.msg header b{color:var(--ink);font-weight:500}
.msg p{margin:0}.re{display:flex;gap:6px;flex-wrap:wrap}.re button{min-height:28px;padding:0 9px;border-radius:99px;font-size:12.5px}
/* watch */
.watchbox{display:grid;place-items:center;padding:8px 0}
.watch{width:250px;height:250px;border-radius:50%;background:#050608;border:10px solid #2a2e35;box-shadow:0 0 0 2px #444a54,0 0 0 9px #1b1e23,0 18px 40px #0008;padding:30px 34px;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:center;position:relative;color:#f4f4f4;transition:background .3s}
.watch:after{content:"";position:absolute;right:-22px;top:calc(50% - 16px);width:9px;height:32px;border-radius:4px;background:#3b4049}
.watch.asteroid{border-color:#3a3f47;box-shadow:0 0 0 2px #59606b,0 0 0 9px #22262c,0 18px 40px #0008}
.watch .os{position:absolute;bottom:22px;left:0;right:0;font-size:10px;letter-spacing:.08em;color:#6c7480;text-transform:uppercase}
.watch .wt{font:600 15px var(--fd);color:#9aa2ad}
.watch .wh{font:600 30px/1 var(--fd)}
.watch .wb{max-width:170px;margin:0 auto}
.watch .wb{font-size:13px;line-height:1.3;color:#d6d8dc}
.watch.stop{background:#3a0d09}.watch.stop .wh{color:#ff6a5b}
.watch.warn .wh{color:#f3b843}.watch.go .wh{color:#68e0a0}
.watch.buzz{animation:buzz .5s 3}
@keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.watch.buzz{animation:none}}
.watch button{min-height:36px;border-radius:99px;background:#2a2e35;border:0;color:#fff;font-size:14px;margin-top:4px}
/* games */
.opts{display:grid;gap:8px}.opts button{text-align:left;padding:10px 12px;min-height:44px}
.opts button.ok{border-color:var(--go);background:var(--gobg)}.opts button.no{border-color:var(--stop);background:var(--stopbg)}
.trk{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;flex:1}.trk i{display:block;height:100%;background:var(--gold)}
.stp{display:grid;grid-template-columns:4.5em minmax(0,1fr) 4.5em;gap:8px;align-items:center;font-size:14px}.stp b{text-align:right;font-weight:500}
.bdg{padding:4px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--dim)}.bdg.on{background:var(--gold);color:var(--on);border-color:var(--gold)}
/* planner */
.board{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
.board .col{display:flex;flex-direction:column;gap:12px}
.team{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.person{display:flex;justify-content:space-between;gap:6px;font-size:14px;padding:3px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--line);margin-left:4px}.dot.ok{background:var(--go)}
.verb{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;background:#0f1013;border:1px dashed #5b4a24;border-radius:6px;padding:6px 8px}
.alert{padding:10px 12px;border-radius:10px;background:var(--stopbg);border:1px solid #7a2c23;color:#ffd9d4}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
nav.tabs button{border:0;background:none;color:var(--dim);font:500 13.5px var(--fd);padding:0 2px;min-height:50px;position:relative}
nav.tabs button[aria-current=page]{background:var(--gold);color:var(--on)}
nav.tabs .pip{position:absolute;top:6px;right:18%;width:8px;height:8px;border-radius:50%;background:var(--stop)}
@media (max-width:860px){.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:460px){.two,.team{grid-template-columns:minmax(0,1fr)}.tl li{grid-template-columns:4.6em minmax(0,1fr)}.tl li>:nth-child(3){grid-column:2}}

.top .in{padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font:600 24px var(--fd)}.brand b{color:var(--gold);font-weight:600}
.logo{width:32px;height:32px}
.persona{display:flex;gap:6px;align-items:center}.persona select{width:auto;min-height:40px;padding:6px 10px}
.demo{border-top:1px solid var(--line);background:#121317}
.demo .in{justify-content:flex-start;max-width:1180px;margin:0 auto;padding:6px max(16px,3vw);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.demo .time{font-size:22px;min-width:5.2em;margin-right:4px}
.pill{font:600 11px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--on);background:var(--gold);border-radius:99px;padding:3px 9px}
.jumps{display:flex;gap:6px;flex-wrap:wrap}
button.ghost{background:transparent}
.about{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel);color:var(--dim);font-size:14px}
.about summary{cursor:pointer;color:var(--ink);font-weight:500}
.about p{margin:8px 0 2px}
@media (max-width:520px){.jumps{width:100%;overflow-x:auto;flex-wrap:nowrap}.jumps button{flex:none}.brand{font-size:21px}.vlab{display:none}.top .in{gap:8px}.top .in>.clock{width:100%;flex-wrap:nowrap}.persona{flex:1}.persona select{width:100%}.demo .time{font-size:19px}}
.card.late{border-color:#5b4516;background:linear-gradient(180deg,#221c0d,var(--panel) 70%)}
.preview{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#101114}
.ok-line{color:var(--go);font-weight:500}
s.muted{text-decoration:line-through}
.map{width:100%;height:auto;display:block;background:#0f1013;border-radius:10px}
.pin{cursor:pointer}.pin:focus{outline:none}.pin:focus circle{stroke:#d9b45f}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0;font-size:13px;color:var(--dim)}.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.maplock{display:grid;place-items:center;min-height:180px;border:1px dashed var(--line);border-radius:10px;color:var(--dim);text-align:center;padding:16px}
.clockin.on{border-color:#22603f}
.callsheet{border-color:#22603f;background:linear-gradient(180deg,#10301f,var(--panel) 80%)}
.toast{background:var(--gobg);border:1px solid #22603f;color:#d5f5e3;border-radius:10px;padding:10px 12px}
.watch.voice{gap:8px;padding:34px 30px}.watch .va{font-size:13.5px;line-height:1.35;color:#f1efe8}
.qa{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:2px}
.ownerlink{color:var(--gold);text-decoration:none;font-weight:500;font-size:14.5px;white-space:nowrap}
.mgrk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mgrk div{background:var(--soft);border-radius:10px;padding:10px}.mgrk b{display:block;font:600 24px var(--fd);font-variant-numeric:tabular-nums}.mgrk small{color:var(--dim)}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:0 14px}
@media (max-width:520px){.mgrk{grid-template-columns:repeat(2,minmax(0,1fr))}.ownerlink{width:100%}}
.start{min-height:100vh;display:grid;place-items:center;padding:32px 18px;background:radial-gradient(900px 500px at 70% 0%,#2c2310 0%,transparent 60%),var(--bg)}
.sin{max-width:860px;display:grid;gap:16px;justify-items:start}.sin .logo{width:54px;height:54px}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.pc{display:grid;gap:4px;text-align:left;padding:18px;min-height:120px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.pc:hover{border-color:var(--gold)}.pc b{font:600 22px var(--fd);color:var(--gold)}.pc small{color:var(--dim)}.pc span{font-size:14.5px}
.tip{margin:0;padding:10px 14px;border-radius:10px;background:#221c0d;border:1px solid #5b4516;color:#f0d595;font-size:14.5px}
@media (max-width:560px){.pick{grid-template-columns:minmax(0,1fr)}}
</style>

/* Reminder engine: cues are derived from beats, so moving a beat re-times every cue that depends on it. */
function cues(){
 const out=[],doc=beat('doc'),flip=beat('flip'),trib=beat('tribute'),dep=beat('depart');
 if(doc){out.push({id:'doc-5',at:doc.t-5,sev:'warn',title:'Documentary in 5',watch:'HOLD SOON',body:`Finish your current table, then hold. ALL food service and clearing stops ${fmt(doc.t)}–${fmt(doc.t+doc.dur)}.`});
  out.push({id:'doc-0',at:doc.t,sev:'stop',title:'PAUSE — service stops',watch:'PAUSE',body:'No service. No clearing. Stay still and out of sightlines.'});
  out.push({id:'doc-end',at:doc.t+doc.dur-1,sev:'go',title:'Documentary over — go',watch:'GO',body:'Clear salads, entrées start. Markers: cow = beef, chix = chix, carrot = veg. Two special plates on our side — check the table twice.'});}
 if(flip)out.push({id:'flip',at:flip.t-10,sev:'warn',title:'Station flip in 10',watch:'FLIP 10',body:'Charcuterie becomes dessert. No backup on charcuterie except crackers and bread.'});
 if(trib)out.push({id:'mid',at:trib.t-15,sev:'warn',title:'Mid-evening check',watch:'CHECK',body:`Dessert station open. Tribute at ${fmt(trib.t)} — clear quietly, stay out of sightlines. Glance at beverage levels; flag your point, don't leave your role.`});
 if(dep)out.push({id:'home',at:dep.t-5,sev:'go',title:'Home stretch',watch:'HOME',body:'Guests leaving: final clearing, breakdown, apron in the laundry bag, parking validation code from your vault.'});
 for(const L of S.late)out.push({id:L.id,at:L.at,sev:'warn',late:true,title:L.undo?'Back on original times':`Running ${L.mins} min late`,watch:L.undo?'RESET':`LATE +${L.mins}`,
  body:(L.undo?'The last delay was undone. ':`${L.reason}${L.note?' — '+L.note:''}. `)+'New times: '+L.changes.slice(0,4).map(c=>`${c.short} ${fmt(c.to)}`).join(', ')+(L.changes.length>4?` +${L.changes.length-4} more`:'')+'. Check Shift for your timeline.'});
 return out.sort((a,b)=>a.at-b.at);
}
function latePlan(){
 const d=S.lateDraft,mins=Math.max(1,Math.min(120,Math.round(+d.mins||0)));
 const fut=[...S.beats].filter(b=>b.t>S.clock).sort((a,b)=>a.t-b.t);
 const changes=[],warn=[];
 for(const b of fut){if(S.locked[b.id])continue;changes.push({id:b.id,label:b.label,short:b.label.split(/ — | · /)[0],from:b.t,to:b.t+mins})}
 for(const lk of fut.filter(b=>S.locked[b.id]))for(const c of changes)if(c.to>=lk.t&&c.from<lk.t)warn.push(`"${c.short}" (${fmt(c.to)}) now runs into fixed "${lk.label.split(/ — | · /)[0]}" at ${fmt(lk.t)} — check with the client.`);
 const crewOut=beat('crewout');if(crewOut&&!S.locked.crewout&&changes.find(c=>c.id==='crewout'))warn.push(`Crew departure moves to ${fmt(crewOut.t+mins)} — later than scheduled shift ends. Any extra time is a manager decision.`);
 return {mins,changes,warn:[...new Set(warn)]};
}
function curBeat(){let c=null;for(const b of [...S.beats].sort((a,b)=>a.t-b.t))if(b.t<=S.clock)c=b;return c}

function paused(){const d=beat('doc');return d&&S.clock>=d.t&&S.clock<d.t+d.dur}
function fire(c,silent){if(S.fired.includes(c.id))return;S.fired.push(c.id);S.cue=c.id;
 S.msgs.push({id:++S.nid,ch:'all',who:'Run of show',role:'Cue',cue:c.sev,text:`${c.title}. ${c.body}`,t:c.at,re:{}});
 if(!silent){const w=$('.watch');if(w){w.classList.remove('buzz');void w.offsetWidth;w.classList.add('buzz')}phoneAlert(c)}}
/* Built-in connector: phone notifications + vibration. On Android, Wear OS watches mirror these automatically;
   AsteroidOS watches get them through AsteroidOS Sync or Gadgetbridge. Works while the app is open; background
   alerts need a push service (planned). */
function phoneAlert(c){
 if(!S.alerts)return;
 const pat=c.sev==='stop'?[400,150,400,150,400]:c.sev==='go'?[150,80,150]:[250,120,250];
 try{navigator.vibrate&&navigator.vibrate(pat)}catch(e){}
 try{if('Notification' in window&&Notification.permission==='granted'){
  const title=(c.sev==='stop'?'⛔ ':c.sev==='go'?'✅ ':'⚠️ ')+c.title,opt={body:c.body,tag:c.id,renotify:true,vibrate:pat,icon:'icon-192.png',badge:'icon-192.png',requireInteraction:c.sev==='stop'};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,opt)).catch(()=>new Notification(title,opt));
  else new Notification(title,opt)}}catch(e){}
}
async function enableAlerts(){
 if(!('Notification' in window)){S.alerts=true;S.alertMsg='This browser has no notifications; the phone will vibrate only.';return}
 try{const r=await Notification.requestPermission();S.alerts=r==='granted';S.alertMsg=r==='granted'?'Alerts on. Cues now buzz this phone and show on a paired Wear OS or AsteroidOS watch.':'Notifications were blocked. Turn them on in your phone settings for Showcall.'}catch(e){S.alertMsg='Notifications aren\'t available here. Install the app to your home screen first.'}

function parseCSV(txt){const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function importStaff(txt){
 const rows=parseCSV(txt);if(rows.length<2)return 'No rows found.';
 const h=rows[0].map(x=>x.trim().toLowerCase()),col=k=>h.findIndex(x=>k.some(y=>x.includes(y)));
 const ni=col(['name','employee','worker']),ri=col(['role','position','job']),ti=col(['team','section','group']),si=col(['start','in']),ei=col(['end','out']);
 if(ni<0)return 'Needs a column called Name (or Employee).';
 const list=rows.slice(1).map(r=>({n:(r[ni]||'').trim(),r:(ri>=0?r[ri]:'Crew').trim()||'Crew',team:((ti>=0?r[ti]:'B').trim().replace(/team\s*/i,'')||'B').toUpperCase().slice(0,4),start:si>=0?r[si].trim():'',end:ei>=0?r[ei].trim():''})).filter(p=>p.n);
 S.imported=list;S.updates.push({at:S.clock,text:`Imported ${list.length} crew from a staffing CSV.`});
 return `Imported ${list.length} crew. ${list.slice(0,3).map(p=>p.n).join(', ')}${list.length>3?'…':''}`;
}

 if(d.act==='publish'){for(const x of S.shifts)if(x.status==='assigned')x.status='confirmed';S.msgs.push({id:++S.nid,ch:'all',who:S.me,role:'Schedule',cue:'go',text:'Schedule published. Check the Shift tab for your upcoming shifts.',t:S.clock,re:{}});S.toast='Schedule published to the crew app.';save();render();return}
 if(d.swap){const [id,v]=d.swap.split('|'),w=S.swaps.find(x=>x.id==id),x=S.shifts.find(y=>y.id===w.shift);w.status=v==='yes'?'approved':'denied';if(v==='yes')x.who=w.to;save();render();return}
 if(d.mdec){const [id,v]=d.mdec.split('|');S.mgrDec[id]=v;if(id.startsWith('idea')&&v==='yes'){const i=S.ideas.find(x=>'idea'+x.id===id);if(i){i.st='Approved';add(i.by,20)}}save();render();return}
 if(d.act==='close-event'){S.closed=true;for(const n in S.onClock)S.onClock[n]=false;S.updates.push({at:S.clock,text:'Event closed: all crew clocked out, zone locations wiped.'});save();render();return}
 if(d.act==='clockin'){S.consentOpen=true;save();render();return}
 if(d.act==='clockin-share'||d.act==='clockin-noshare'){S.onClock[S.me]=true;S.clockLog.push({n:S.me,in:S.clock,out:null});S.sharing[S.me]=d.act==='clockin-share';S.consentOpen=false;S.updates.push({at:S.clock,text:`${S.me} clocked in${S.sharing[S.me]?' · sharing area':''}.`});save();render();return}
 if(d.act==='clockout'){const cl=[...S.clockLog].reverse().find(x=>x.n===S.me&&x.out==null);if(cl)cl.out=S.clock;S.onClock[S.me]=false;S.sharing[S.me]=null;delete S.pauseUntil[S.me];S.call=null;S.updates.push({at:S.clock,text:`${S.me} clocked out · location sharing stopped.`});save();render();return}
 if(d.act==='pause15'){S.pauseUntil[S.me]=S.clock+15;save();render();return}
 if(d.act==='resume'){delete S.pauseUntil[S.me];save();render();return}
 if(d.act==='stopshare'){S.sharing[S.me]=false;save();render();return}
 if(d.act==='startshare'){S.sharing[S.me]=true;save();render();return}
 if(d.call){S.call=d.call;save();render();scrollTo(0,0);return}
 if(d.act==='hangup'){S.call=null;save();render();return}
 if(d.ping){const p=PEOPLE.find(x=>x.n===d.ping);S.toast=`Ping sent. ${p.n}'s watch buzzes: "${S.me} is looking for you${visible(me())?' at '+ZNAME(zoneOf(me())):''}".`;save();render();setTimeout(()=>{S.toast=null;render()},4000);return}
 if(d.latemin){S.lateDraft.mins=+d.latemin;S.lateDraft.preview=false;save();render();return}
 if(d.act==='late-preview'){S.lateDraft.preview=true;save();render();return}
 if(d.act==='late-cancel'){S.lateDraft.preview=false;save();render();return}
 if(d.act==='late-apply'){const P=latePlan();if(!P.changes.length)return;
  for(const c of P.changes){const b=beat(c.id);b.t=c.to;b.moved=(b.moved||0)+P.mins}
  const id='late-'+(++S.nid);S.late.push({id,at:S.clock,mins:P.mins,reason:S.lateDraft.reason,note:S.lateDraft.note.trim(),by:S.me,changes:P.changes});
  S.updates.push({at:S.clock,text:`Running ${P.mins} min late (${S.lateDraft.reason}). ${P.changes.length} beats moved; crew notified.`});
  S.lateDraft={mins:P.mins,reason:S.lateDraft.reason,note:'',preview:false};retime();tick();S.cue=id;save();render();buzz();return}
 if(d.act==='late-undo'){const L=[...S.late].reverse().find(x=>!x.undo&&!x.reverted);if(!L)return;
  for(const c of L.changes){const b=beat(c.id);if(b){b.t-=L.mins;b.moved=(b.moved||0)-L.mins}}L.reverted=true;
  const id='late-'+(++S.nid);S.late.push({id,at:S.clock,mins:L.mins,undo:true,reason:'',note:'',by:S.me,changes:L.changes.map(c=>({...c,from:c.to,to:c.from}))});
  S.updates.push({at:S.clock,text:`Undid the +${L.mins} min delay; crew notified.`});retime();tick();S.cue=id;save();render();buzz();return}
 if(d.os){S.os=d.os;save();render();return}
 if(d.jump){S.clock=+d.jump;retime();tick();save();render();return}
 if(d.ch){S.ch=d.ch;save();render();return}
 if(d.act==='play'){S.play=!S.play;save();render();return}
 if(d.act==='reset'){const lay=S.lay,me_=S.me;S=JSON.parse(JSON.stringify(DEF));S.lay=lay;S.me=me_;S.started=true;S.clock=T(19,10);save();render();return}
 if(d.act==='nextq'){S.qi++;S.ans=null;save();render();return}
 if(d.act==='simacks'){for(const c of cues())if(S.fired.includes(c.id))S.acks[c.id]=[...new Set([...(S.acks[c.id]||[]),...PEOPLE.filter((p,i)=>i%4!==3).map(p=>p.n)])];save();render();return}
 if(d.act==='upd-depart'){const dp=beat('depart');if(dp.t!==T(21,0)){S.updates.push({at:S.clock,text:`Guest departure ${fmt(dp.t)} → 9:00 PM (floor lead, huddle). Home-stretch cue now 8:55 PM.`});dp.moved=(dp.moved||0)+(T(21,0)-dp.t);dp.t=T(21,0);retime();tick()}save();render();return}
 if(d.act==='upd-doc'){const dc=beat('doc');S.updates.push({at:S.clock,text:`Documentary ${fmt(dc.t)} → ${fmt(dc.t+10)}. Pause and go cues moved 10 min.`});moveBeat('doc',10);save();render();return}
 if(d.move){const [id,v]=d.move.split('|');moveBeat(id,+v);save();render();return}
 if(d.spec){const s=S.specials.find(x=>x.id==d.spec);if(s.status<4)s.status++;save();render();return}
 if(d.stn){const [x,v]=d.stn.split('|');S.station[x]=v;if(['Low','Out'].includes(v))S.msgs.push({id:++S.nid,ch:'mgr',who:'Station watch',role:'Alert',cue:'warn',text:`Charcuterie ${x==='A'?1:2} is ${v}. No backup except crackers and bread.`,t:S.clock,re:{}});save();render();return}
 if(d.ack){S.acks[d.ack]=[...new Set([...(S.acks[d.ack]||[]),S.me])];add(S.me,2);save();render();return}
 if(d.re){const [id,r]=d.re.split('|'),m=S.msgs.find(x=>x.id==id);m.re=m.re||{};const v=m.re[r]=m.re[r]||[],i=v.indexOf(S.me);if(i>=0)v.splice(i,1);else v.push(S.me);save();render();return}
 if(d.done){const t=S.tasks.find(x=>x.id==d.done);if(!t.done){t.done=true;add(S.me,10);stat(S.me).tasks++}save();render();return}
 if(d.vote){const i=S.ideas.find(x=>x.id==d.vote);if(!i.votes.includes(S.me)&&i.by!==S.me)i.votes.push(S.me);save();render();return}
 if(d.ans!==undefined){const q=QS[S.qi%QS.length];S.ans=+d.ans;if(S.ans===q[2]){add(S.me,5);stat(S.me).ok++;S.streak++}else S.streak=0;save();render();return}
 if(d.sms){S.sms[S.me]=S.sms[S.me]||{};S.sms[S.me][d.sms]=!S.sms[S.me][d.sms];save();render();return}
});
function moveBeat(id,v){const b=beat(id);b.t+=v;b.moved=(b.moved||0)+v;
 if(id==='doc'){const dn=beat('dinner');dn.t+=v;dn.moved=(dn.moved||0)+v}/* dinner follows the documentary */
 retime();tick();}
function buzz(){const w=document.querySelector('.watch');if(w){w.classList.remove('buzz');void w.offsetWidth;w.classList.add('buzz')}}
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset&&t.dataset.lock){S.locked[t.dataset.lock]=t.checked;save();render();return}
 if(t.id==='aprons'){S.aprons=t.value===''?null:Math.max(0,Math.min(44,+t.value));save();render();return}
 if(t.id==='speak'){S.speak=t.checked;save();return}
 if(t.id==='lateReason'){S.lateDraft.reason=t.value;save();return}
 if(t.id==='lateMins'){S.lateDraft.mins=+t.value;save();render();return}if(t.id==='me'){S.me=t.value;if(S.ch==='mgr'&&!manage())S.ch='all';save();render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.assign){seedShifts();const x=S.shifts.find(y=>y.id==t.dataset.assign);x.who=t.value||null;x.status=t.value?'assigned':'open';save();render();return}
 if(['nsEv','nsRole','nsStart','nsEnd','nsN'].includes(t.id)){S.newShift={ev:$('#nsEv').value,role:$('#nsRole').value,start:$('#nsStart').value,end:$('#nsEnd').value,n:+$('#nsN').value||1};save();return}
 if(t.id!=='csv'||!t.files||!t.files[0])return;const f=t.files[0];f.text().then(txt=>{S.importMsg=importStaff(txt);save();render()}).catch(()=>{S.importMsg='Could not read that file.';render()})});
document.addEventListener('input',e=>{if(e.target.id==='draft')S.draft=e.target.value;if(e.target.id==='lateNote')S.lateDraft.note=e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.id;
 if(f==='sform2'){seedShifts();const n=S.newShift,ev=EVENTS.find(e=>e[0]===n.ev);let id=Math.max(...S.shifts.map(y=>y.id));for(let i=0;i<Math.min(20,n.n||1);i++)S.shifts.push({id:++id,ev:n.ev,date:ev[1],role:n.role,start:n.start,end:n.end,who:null,status:'open'});S.toast=`Added ${n.n} open ${n.role} shift${n.n>1?'s':''}.`}
 if(f==='vform'){const v=$('#vq');ask(v.value);v.value=''}
 if(f==='cform'){const tx=S.draft.trim();if(!tx)return;S.msgs.push({id:++S.nid,ch:S.ch,who:S.me,role:me().r,text:tx,t:S.clock,re:{}});S.draft='';add(S.me,1);stat(S.me).msgs++}
 if(f==='tform'){if(!isMgr()){S.toast='Only managers can create tasks';render();return}S.tasks.push({id:++S.nid,title:$('#tT').value.trim(),to:$('#tW').value,due:$('#tD').value.trim()||'Soon',by:S.me,done:false})}
 if(f==='iform'){S.ideas.push({id:++S.nid,text:$('#iT').value.trim(),cat:'Floor',by:S.me,votes:[],st:'New'});add(S.me,5)}
 if(f==='bform'){const tx=$('#bT').value.trim();if(!tx)return;const id='b'+(++S.nid);S.msgs.push({id:S.nid,ch:'all',who:S.me,role:'Broadcast',cue:'warn',text:tx,t:S.clock,re:{}});S.updates.push({at:S.clock,text:'Broadcast: '+tx})}
 save();render()});
/* clock: 1 or 5 sim-minutes per real second */
let last=performance.now();
setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;if(!S.play)return;
 const before=S.clock;S.clock=Math.min(T(23,30),S.clock+dt*S.speed);if(S.clock>=T(23,30))S.play=false;
 const firedBefore=S.fired.length;tick();
 if(Math.floor(before)!==Math.floor(S.clock)||S.fired.length!==firedBefore){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){const tm=$('.time');if(tm)tm.textContent=fmt(S.clock);return}render();save()}},250);
for(const c of cues())if(c.at<=S.clock&&!S.fired.includes(c.id))fire(c,true);
render();
}
</script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
